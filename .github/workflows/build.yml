name: Build Windows EXE & Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: PallaVsPalla-Windows
          path: build/Release/PallaVsPalla.exe
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android CMake 3.30.3
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "y" | "$SDK/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3"
      - run: git clone --recurse-submodules --depth 1 https://github.com/Bigfoot71/raymob.git android-build
      - name: Inject Game Sources, HTTP, Native Keyboard & Fullscreen
        run: python3 android/patch_android.py android-build
      - working-directory: android-build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Collect APK
        run: |
          mkdir -p apk-out
          find android-build -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out
      - uses: actions/upload-artifact@v4
        with:
          name: PallaVsPalla-Android-APK
          path: apk-out/*.apk
          if-no-files-found: error